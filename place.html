<!DOCTYPE html>
<html lang="en">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mexico | Aaron Pazaran</title>
    <meta name="description" content="An informative page about Mexico: key country data and current weather conditions.">
    <meta name="author" content="Aaron Ali Pazaran Hernandez">
 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
 
    <link rel="stylesheet" href="styles/place.css">
    <link rel="stylesheet" href="styles/place-large.css">
    <script src="scripts/place.js" defer></script>
</head>
 
<body>
    <header>
        <h1>M&eacute;xico</h1>
    </header>
 
    <main>
        <div class="hero_wrap">
            <picture>
                <source media="(min-width: 700px)" srcset="images/hero-mexico-wide.webp">
                <img src="images/hero-mexico-mobile.webp" alt="Illustrated desert sunset landscape with saguaro cacti, representing Mexico" class="hero_image">
            </picture>
 
            <section class="card data_card">
                <h2>Data</h2>
                <dl>
                    <dt>Area:</dt>
                    <dd>1,964,375 sq&nbsp;km</dd>
 
                    <dt>Population:</dt>
                    <dd>131,946,900</dd>
 
                    <dt>Capital:</dt>
                    <dd>Mexico City</dd>
 
                    <dt>Languages:</dt>
                    <dd>Spanish</dd>
 
                    <dt>Currency:</dt>
                    <dd>Mexican Peso (MXN)</dd>
 
                    <dt>Time Zone:</dt>
                    <dd>UTC&minus;6</dd>
 
                    <dt>Calling Code:</dt>
                    <dd>+52</dd>
 
                    <dt>Internet TLD:</dt>
                    <dd>.mx</dd>
                </dl>
            </section>
 
            <section class="card weather_card">
                <h2>Weather <img src="images/weather-partly-cloudy.svg" alt="Partly cloudy" class="weather_icon_svg"></h2>
                <dl>
                    <dt>Temperature:</dt>
                    <dd id="temperature">&ndash;</dd>
 
                    <dt>Conditions:</dt>
                    <dd>Partly Cloudy</dd>
 
                    <dt>Wind:</dt>
                    <dd id="wind">&ndash;</dd>
 
                    <dt>Wind Chill:</dt>
                    <dd id="windChill">&ndash;</dd>
                </dl>
            </section>
        </div>
    </main>
<body>
     <footer>
        <p>&copy;<span id="year"></span> 🦗 Aaron Pazaran 🦗 Pachuca, México</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
