<!DOCTYPE html>
<html lang="en-US">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WDD 131 | Dynamic Web Fundamentals | Review Confirmation</title>
  <meta name="description" content="Confirmation page for the product review form">
  <meta name="author" content="Aaron Ali Pazaran Hernandez">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/base.css">

  <script src="scripts/products.js" defer></script>
  <script src="scripts/review.js" defer></script>
  <script src="scripts/getdates.js" defer></script>
</head>

<body>
  <header>
    <h1>Product Review</h1>
  </header>

  <main>
    <section class="card confirmation">
      <h2>Review Submitted</h2>
      <p class="confirmation-intro" id="confirmationIntro">Loading your submission...</p>

      <dl class="confirmation-list" id="confirmationList"></dl>

      <p class="review-counter">
        You are reviewer number <strong id="reviewCount">0</strong> for this site.
      </p>

      <a class="submit-btn" href="form.html">Submit Another Review</a>
    </section>
  </main>

  <footer>
    <p>©<span id="year"></span> 🦗 Aaron Pazaran 🦗 Pachuca, México</p>
    <p id="lastModified"></p>
  </footer>
</body>

</html>
